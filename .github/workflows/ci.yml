name: CI

on:
  push:
  pull_request:

jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./...
        working-directory: backend/services/routing-service
  traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
        working-directory: backend/services/traffic-service
      - run: python -m pytest
        working-directory: backend/services/traffic-service
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: backend/services/auth-service
      - run: npm test -- --runInBand
        working-directory: backend/services/auth-service
      - run: npm run build
        working-directory: backend/services/auth-service
  users:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: backend/services/user-service
      - run: npm test
        working-directory: backend/services/user-service
      - run: npm run build
        working-directory: backend/services/user-service
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - run: flutter pub get
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: admin-panel
      - run: npm run build
        working-directory: admin-panel
