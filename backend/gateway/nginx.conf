limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

upstream auth_service { server auth-service:3000; }
upstream routing_service { server routing-service:8081; }
upstream traffic_service { server traffic-service:8000; }
upstream user_service { server user-service:3002; }

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    location = /health { return 200 '{"status":"ok"}'; add_header Content-Type application/json; }
    location /api/v1/auth/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://auth_service/auth/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/v1/routes/ {
        limit_req zone=api_limit burst=3 nodelay;
        proxy_pass http://routing_service/routes/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/v1/traffic/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://traffic_service/traffic/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/v1/users/ {
        proxy_pass http://user_service/users/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
